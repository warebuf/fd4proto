<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0; height: 100vh;
    display: grid; place-content: center; gap: 14px;
    background: #12141a; color: #8f97a3;
    font: 14px system-ui, sans-serif;
  }
  canvas {
    border-radius: 10px; cursor: pointer;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55);
  }
  #bar { width: 1024px; display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit; padding: 6px 14px;
    border: 1px solid #39424a; border-radius: 6px;
    background: #21272d; color: #dfe4e8; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #2b333a; }
  button:disabled { opacity: 0.45; cursor: default; }
  #status { margin-left: 6px; font-variant-numeric: tabular-nums; }
  #keys { margin-left: auto; font-size: 12px; color: #5d6472; }
</style>
</head>
<body>

<canvas id="c" width="1024" height="768"></canvas>
<div id="bar">
  <button id="sim"></button>
  <button id="play"></button>
  <button id="step"></button>
  <span id="status"></span>
  <span id="keys">space play/pause &middot; &rarr; step &middot; esc stop</span>
</div>

<script>
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

const CARD_W = 100, CARD_H = 100, GAP = 15;
const COLS = 5, ROWS = 2, SLOTS = COLS * ROWS;
const HAND_MAX_W = 900;   // hands fan inward past this, rather than overflowing
const SIDES = ['top', 'bottom'];

// field[0..2] is always the frontline and field[3..5] the backline, on BOTH
// sides. Only slotPos() knows that a top-side frontline draws lower on screen
// than its backline — every rule downstream can just ask `index < COLS`.
function isFront(index) { return index < COLS; }

// Rows mirror about the centre line, so the two frontlines face each other.
const ROW_Y = {
  top:    { hand:  26, front: 262, back: 150 },
  bottom: { hand: 642, front: 406, back: 518 },
};

const FIELD_X = (cv.width - (COLS * CARD_W + (COLS - 1) * GAP)) / 2;
const DECK_X  = FIELD_X + COLS * (CARD_W + GAP) + 40;
const GRAVE_X = cv.width - DECK_X - CARD_W;   // mirrors the deck across the board

// --- state ------------------------------------------------------------------

let nextId = 1;

const STAT_MIN = 1, STAT_MAX = 5;
const roll = () => STAT_MIN + Math.floor(Math.random() * (STAT_MAX - STAT_MIN + 1));

function makeCard() {
  const card = { id: nextId++, crowned: false, atk: roll(), spd: roll(), hp: roll(), cd: 0 };
  card.cd = attackInterval(card);   // starts uncharged
  return card;
}

function makeSide() {
  const deck = [];
  for (let i = 0; i < 20; i++) deck.push(makeCard());
  return { deck, hand: [], grave: [], field: new Array(SLOTS).fill(null) };
}

const sides = { top: makeSide(), bottom: makeSide() };

// what the player has picked up: { side, from: 'hand'|'field'|'grave', index }
let sel   = null;
let hover = null;

// the board is read-only while a simulation is running
let simulating = false;

// --- layout -----------------------------------------------------------------

function handStep(n) {
  if (n <= 1) return 0;
  return Math.min(CARD_W + GAP, (HAND_MAX_W - CARD_W) / (n - 1));
}

// cards lift toward the middle of the table, so both hands read the same way
function liftDir(side) { return side === 'top' ? 1 : -1; }

function handPos(side, i) {
  const n    = sides[side].hand.length;
  const step = handStep(n);
  const x    = (cv.width - (CARD_W + step * (n - 1))) / 2 + i * step;
  let   y    = ROW_Y[side].hand;

  if (sel && sel.side === side && sel.from === 'hand' && sel.index === i)
    y += liftDir(side) * 24;
  else if (hover && hover.kind === 'hand' && hover.side === side && hover.index === i)
    y += liftDir(side) * 12;

  return { x, y };
}

function slotPos(side, index) {
  return {
    x: FIELD_X + (index % COLS) * (CARD_W + GAP),
    y: ROW_Y[side][isFront(index) ? 'front' : 'back'],
  };
}

// deck and graveyard sit outboard on each side's back row, deck right, grave left
function deckPos(side)  { return { x: DECK_X,  y: ROW_Y[side].back }; }
function gravePos(side) { return { x: GRAVE_X, y: ROW_Y[side].back }; }

function handBand(side) {
  return { y: ROW_Y[side].hand + Math.min(0, liftDir(side) * 24), h: CARD_H + 24 };
}

// --- hit testing ------------------------------------------------------------

function inRect(mx, my, x, y, w = CARD_W, h = CARD_H) {
  return mx >= x && mx < x + w && my >= y && my < y + h;
}

function hitTest(mx, my) {
  for (const side of SIDES) {
    // backwards, so the topmost card wins any overlap in a fanned hand
    const hand = sides[side].hand;
    for (let i = hand.length - 1; i >= 0; i--) {
      const { x, y } = handPos(side, i);
      if (inRect(mx, my, x, y)) return { kind: 'hand', side, index: i };
    }

    for (let i = 0; i < SLOTS; i++) {
      const { x, y } = slotPos(side, i);
      if (inRect(mx, my, x, y)) return { kind: 'field', side, index: i };
    }

    const d = deckPos(side);
    if (sides[side].deck.length && inRect(mx, my, d.x, d.y))
      return { kind: 'deck', side };

    const gy = gravePos(side);
    if (inRect(mx, my, gy.x, gy.y)) return { kind: 'grave', side };

    // empty space in the hand row — lets a field card be pulled back to hand
    const band = handBand(side);
    if (inRect(mx, my, 0, band.y, cv.width, band.h))
      return { kind: 'handzone', side };
  }
  return null;
}

// --- actions ----------------------------------------------------------------

function drawFromDeck(side) {
  const s = sides[side];
  if (s.deck.length) s.hand.push(s.deck.pop());
}

// The crown is a field status and a side may hold only one, so crowning a
// second unit moves it rather than being refused. Leaving the field drops it.
function crownedIndex(side) {
  return sides[side].field.findIndex(c => c && c.crowned);
}

function toggleCrown(side, index) {
  const card = sides[side].field[index];
  if (!card) return;
  const wasCrowned = card.crowned;
  for (const c of sides[side].field) if (c) c.crowned = false;
  card.crowned = !wasCrowned;
}

// hand and graveyard are both plain lists, so they behave alike as a source
function zoneList(side, from) {
  return from === 'hand' ? sides[side].hand : sides[side].grave;
}

// An occupied destination swaps rather than overwrites, so a card is never
// destroyed by a misclick.
function placeOnField(dest) {
  const s = sides[sel.side];

  if (sel.from === 'field') {
    const card = s.field[sel.index];
    s.field[sel.index] = s.field[dest];
    s.field[dest] = card;
    return;
  }

  const list     = zoneList(sel.side, sel.from);
  const card     = list[sel.index];
  const occupant = s.field[dest];
  s.field[dest] = card;
  if (occupant) { occupant.crowned = false; list[sel.index] = occupant; }
  else          list.splice(sel.index, 1);
}

// Lift the held card out of wherever it is. The crown is a field status, so it
// never survives the trip.
function liftSelected() {
  const s = sides[sel.side];
  let card;

  if (sel.from === 'field') {
    card = s.field[sel.index];
    if (!card) return null;
    s.field[sel.index] = null;
  } else {
    card = zoneList(sel.side, sel.from).splice(sel.index, 1)[0];
    if (!card) return null;
  }

  card.crowned = false;
  card.cd = attackInterval(card);
  return card;
}

function returnToHand(at) {
  const card = liftSelected();
  if (!card) return;
  const hand = sides[sel.side].hand;
  hand.splice(at === undefined ? hand.length : at, 0, card);
}

function sendToGrave() {
  const card = liftSelected();
  if (card) sides[sel.side].grave.push(card);
}

// --- combat -----------------------------------------------------------------

const TICKS = 3;

function other(side) { return side === 'top' ? 'bottom' : 'top'; }

// abilities are NOT simultaneous. they resolve one at a time by card position,
// down each column before moving right: left front, left back, second front,
// second back. attacks and deaths are simultaneous, abilities cannot be
//
// "left" means each player's own left, so the board is symmetric under a 180
// degree turn. The top player's sweep therefore runs right to left across the
// screen, and the two sides sweep toward each other.
const RESOLUTION_ORDER = { top: [], bottom: [] };
for (let col = 0; col < COLS; col++) {
  const mirrored = COLS - 1 - col;
  RESOLUTION_ORDER.bottom.push(col, col + COLS);
  RESOLUTION_ORDER.top.push(mirrored, mirrored + COLS);
}

// SPD is how fast, not how slow: 5 SPD swings every tick, 1 SPD every 5.
function attackInterval(card) { return STAT_MAX + 1 - card.spd; }

// TARGETING — the one rule to change if you want different behaviour. Uniformly
// random across every living enemy; position buys nothing.
function targetFor(side) {
  const foe = sides[other(side)].field;
  const live = [];
  for (let i = 0; i < SLOTS; i++) if (foe[i]) live.push(i);
  if (!live.length) return -1;
  return live[Math.floor(Math.random() * live.length)];
}

// The corpse keeps the damage that killed it, so the board stays readable after
// a run. The crown does not follow it — that is field state, and letting it into
// the graveyard would let a revived unit make two crowns on one side.
function kill(side, index) {
  const s = sides[side];
  const card = s.field[index];
  card.crowned = false;
  s.grave.push(card);
  s.field[index] = null;
}

// Every occupied slot, both sides interleaved, in resolution order — so no
// phase has to repeat the double walk.
function* units() {
  for (let k = 0; k < SLOTS; k++)
    for (const side of SIDES) {
      const i = RESOLUTION_ORDER[side][k];
      const card = sides[side].field[i];
      if (card) yield { side, slot: i, card };
    }
}

// A tick runs in four phases, each its own function below. They are separate
// because each one has to leave a SETTLED BOARD behind it: no half-applied
// damage, no corpses still standing. That is what makes a run readable — and it
// is the same property triggers will need when they arrive (see phaseStrike).
//
// The runner plays them one at a time, so `data` accumulates across the four
// and is thrown away at the end of the tick.
function newTickData() { return { charged: [], ready: [], blows: [], dead: [] }; }

// PHASE 1 — CHARGE. Every unit's cooldown drops by one; anything reaching zero
// is ready to swing. Nothing is spent here: the cooldown is not reset until the
// blow actually lands in STRIKE, so a ready unit reads as a full row of pips
// for the whole of DECLARE instead of blanking the instant it fires.
//
// Charging is simultaneous — no unit's cooldown depends on another's — but
// twelve pips filling on one frame is a wall of movement nobody can read, so
// `charged` keeps the walk order and the phase plays it back one unit at a
// time. The sweep is the resolution order itself, which is worth seeing: it is
// the tiebreak that will decide trigger queue order.
function phaseCharge(data) {
  data.charged = [];
  data.ready   = [];
  for (const u of units()) {
    u.card.cd--;
    const order = data.charged.length;
    data.charged.push({ side: u.side, slot: u.slot, card: u.card, order });
    if (u.card.cd <= 0) data.ready.push({ side: u.side, slot: u.slot, order });
  }
  return data.ready.length;
}

// PHASE 2 — DECLARE. Each ready unit locks a target against the board as it
// stands, before any damage moves. Targeting is uniformly random across living
// enemies, so this is the phase to watch when a run looks unfair.
function phaseDeclare(data) {
  data.blows = [];
  for (const { side, slot } of data.ready) {
    const attacker = sides[side].field[slot];
    if (!attacker) continue;
    const target = targetFor(side);
    if (target < 0) continue;   // nothing left to hit
    data.blows.push({
      side, slot, toSide: other(side), toSlot: target, dmg: attacker.atk,
    });
  }
  return data.blows.length;
}

// PHASE 3 — STRIKE. Every declared blow lands at once, so neither side resolves
// "first". Damage is simultaneous because no sequential order can be fair:
// whoever swings first removes their own retaliator. In mirror matches,
// resolving all of one side first won 84% of games, and interleaving by slot
// still won 68%.
//
// Nothing is removed here — a unit already at 0 hp still takes the second blow
// aimed at it, and does not leave the board until CLEANUP.
//
// TRIGGERS, when they arrive, do NOT go in this phase. They belong in a queue
// drained after it — and again after CLEANUP for death triggers — resolving one
// event at a time in the order queued. That is what keeps them legible: an
// effect always reads a settled board, never one that is half updated. CHARGE's
// row-major walk (frontline left to right, then backline) is what decides that
// queue order, so it stays a tiebreak rather than an advantage.
function phaseStrike(data) {
  for (const { side, slot } of data.ready) {
    const card = sides[side].field[slot];
    if (card) card.cd = attackInterval(card);
  }
  for (const b of data.blows) {
    const victim = sides[b.toSide].field[b.toSlot];
    if (victim) victim.hp -= b.dmg;
  }
  return data.blows.length;
}

// PHASE 4 — CLEANUP. Anything at or below 0 hp dies. Collected before any of it
// is removed, so the walk reads one settled board rather than a shrinking one.
function phaseCleanup(data) {
  data.dead = [];
  for (const u of units())
    if (u.card.hp <= 0) data.dead.push({ side: u.side, slot: u.slot, card: u.card });
  for (const d of data.dead) kill(d.side, d.slot);
  return data.dead.length;
}

// CHARGE sweeps one unit at a time, so it is the one phase whose length depends
// on the board: CHARGE_STEP per unit, then a fifth of the phase again as a pause
// on the settled result.
const CHARGE_STEP  = 105;   // ms per unit in the sweep
const CHARGE_SWEEP = 0.8;   // fraction of the phase the sweep occupies

function chargeMs(data) {
  return Math.max(520, (data.charged.length * CHARGE_STEP) / CHARGE_SWEEP);
}

// ms  — how long the phase plays for when running, or a function of the tick
// hold— where its animation freezes when stepped, picked as the moment the
//       phase reads best: lunges extended, corpses half faded.
// A phase that produced nothing is skipped rather than given a beat of its own,
// except CHARGE, which always has pips to move.
const PHASES = [
  { key: 'charge',  label: 'CHARGE',  ms: chargeMs, hold: 1,
    tally: n => `${n} ready`,
    blurb: ['cooldowns drop by one —', 'swept in resolution order'] },
  { key: 'declare', label: 'DECLARE', ms: 950, hold: 1,
    tally: n => `${n} declared`,
    blurb: ['each swinger locks a target', 'on the board as it stands'] },
  { key: 'strike',  label: 'STRIKE',  ms: 900, hold: 0.32,
    tally: n => `${n} landed`,
    blurb: ['every blow lands at once,', 'so neither side goes first'] },
  { key: 'cleanup', label: 'CLEANUP', ms: 780, hold: 0.5,
    tally: n => (n ? `${n} dies` : 'none'),
    blurb: ['anything at or below 0 hp', 'goes to the graveyard'] },
];

const PHASE_RUN = {
  charge: phaseCharge, declare: phaseDeclare,
  strike: phaseStrike, cleanup: phaseCleanup,
};

function fieldCount(side) { return sides[side].field.filter(Boolean).length; }

function outcome() {
  const t = fieldCount('top'), b = fieldCount('bottom');
  if (!t && !b) return 'both sides wiped';
  if (!t) return 'bottom wins';
  if (!b) return 'top wins';
  return null;
}

// --- drawing ----------------------------------------------------------------

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

// ATK / SPD / HP / DPS across the foot of the card, colour-coded so they read
// apart at a glance without needing the labels. DPS is derived (average damage
// per tick), so it's a function of the card rather than a stored key.
const STAT_STRIP = 40;
const STATS = [
  ['ATK', c => c.atk, '#b4463c'],
  ['SPD', c => c.spd, '#4a7fb5'],
  ['HP',  c => c.hp,  '#3f8a5c'],
  ['DPS', c => (c.atk / attackInterval(c)).toFixed(1), '#c98a3c'],
];

function drawStats(card, x, y) {
  const top = y + CARD_H - STAT_STRIP;

  ctx.strokeStyle = 'rgba(30,35,42,0.16)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.moveTo(x + 9,          top);
  ctx.lineTo(x + CARD_W - 9, top);
  ctx.stroke();

  ctx.textAlign = 'center';
  STATS.forEach(([label, value, colour], i) => {
    const cx = x + CARD_W * (i * 2 + 1) / (STATS.length * 2);

    ctx.textBaseline = 'top';
    ctx.fillStyle    = '#8b8880';
    ctx.font         = '9px system-ui, sans-serif';
    ctx.fillText(label, cx, top + 6);

    ctx.textBaseline = 'middle';
    ctx.fillStyle    = colour;
    ctx.font         = 'bold 15px system-ui, sans-serif';
    ctx.fillText(value(card), cx, top + 27);
  });
}

// three-peaked crown on a banded base, drawn in a 26x17 box
function drawCrown(x, y) {
  const w = 26, h = 17, band = 5;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x,           y + h - band);
  ctx.lineTo(x,           y + 2);
  ctx.lineTo(x + w * 0.27, y + h - band - 3);
  ctx.lineTo(x + w / 2,   y);
  ctx.lineTo(x + w * 0.73, y + h - band - 3);
  ctx.lineTo(x + w,       y + 2);
  ctx.lineTo(x + w,       y + h - band);
  ctx.closePath();
  ctx.fillStyle = '#e8c15c';
  ctx.fill();
  ctx.strokeStyle = '#8a6a1c';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.rect(x - 1, y + h - band, w + 2, band);
  ctx.fillStyle = '#d9ae43';
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// How far the CHARGE sweep has got to the unit at `order` in the walk: below 0
// it has not reached them, above 1 they have settled. Only meaningful inside
// the charge phase, which is the only place it is called from.
function chargeProgress(order) {
  const n = sim.data.charged.length || 1;
  const each = CHARGE_SWEEP / n;
  return (sim.t - order * each) / each;
}

// A card the sweep has not reached yet still shows last tick's cooldown, so its
// pip lands when its turn comes rather than on the frame the phase began.
function chargeEntry(card) {
  return inPhase('charge')
    ? sim.data.charged.find(e => e.card === card)
    : undefined;
}

function displayCd(card) {
  const e = chargeEntry(card);
  return e && chargeProgress(e.order) <= 0 ? card.cd + 1 : card.cd;
}

// 1 the moment a pip lands, easing to 0 — the newest pip swells as it arrives
function chargePop(card) {
  const e = chargeEntry(card);
  if (!e) return 0;
  const p = chargeProgress(e.order);
  return p > 0 && p < 1 ? 1 - p : 0;
}

// One pip per tick of the unit's attack interval, filling as it charges. A SPD 5
// unit shows a single pip that fills every tick; a SPD 1 unit shows five.
function drawCharge(card, x, y) {
  const total  = attackInterval(card);
  const filled = Math.max(0, Math.min(total, total - displayCd(card)));
  const pop    = chargePop(card);
  const r = 4.5, gap = 5;
  const w = total * (r * 2) + (total - 1) * gap;
  let px = x + (CARD_W - w) / 2 + r;
  const py = y + 45;

  for (let i = 0; i < total; i++) {
    const landing = pop > 0 && i === filled - 1;
    ctx.save();
    if (landing) {
      ctx.shadowColor = '#6aa8e0';
      ctx.shadowBlur  = 10 * pop;
    }
    ctx.beginPath();
    ctx.arc(px, py, landing ? r * (1 + 0.8 * pop) : r, 0, Math.PI * 2);
    if (i < filled) {
      ctx.fillStyle = landing ? '#6aa8e0' : '#4a7fb5';
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(30,35,42,0.30)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
    px += r * 2 + gap;
  }
}

function drawCard(card, x, y, selected) {
  ctx.save();
  ctx.shadowColor   = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur    = 14;
  ctx.shadowOffsetY = 5;
  ctx.fillStyle     = '#f7f6f2';
  roundRect(x, y, CARD_W, CARD_H, 9);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = selected ? '#e0b64a' : '#cdc9c0';
  ctx.lineWidth   = selected ? 3 : 1.5;
  roundRect(x, y, CARD_W, CARD_H, 9);
  ctx.stroke();

  ctx.fillStyle    = '#1e232a';
  ctx.textAlign    = 'left';
  ctx.textBaseline = 'top';
  ctx.font         = 'bold 16px system-ui, sans-serif';
  ctx.fillText(card.id, x + 10, y + 9);

  drawCharge(card, x, y);
  drawStats(card, x, y);

  if (card.crowned) drawCrown(x + CARD_W - 35, y + 9);
}

function drawSlot(side, index) {
  const { x, y } = slotPos(side, index);
  const isTarget = sel && sel.side === side;
  const isHover  = hover && hover.kind === 'field' &&
                   hover.side === side && hover.index === index;

  let stroke;
  if (isTarget) {
    stroke = `rgba(224,182,74,${isHover ? 0.9 : 0.34})`;
  } else {
    stroke = `rgba(255,255,255,${isHover ? 0.26 : 0.12})`;
  }

  ctx.save();
  ctx.setLineDash([5, 5]);
  ctx.lineWidth   = 1.5;
  ctx.strokeStyle = stroke;
  roundRect(x, y, CARD_W, CARD_H, 9);
  ctx.stroke();
  ctx.restore();
}

function drawDeck(side) {
  const { x, y } = deckPos(side);
  const n = sides[side].deck.length;

  if (!n) {
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth   = 1.5;
    roundRect(x, y, CARD_W, CARD_H, 9);
    ctx.stroke();
    ctx.restore();
    return;
  }

  // a few offset backs, so the stack reads as depth
  for (let i = Math.min(3, n - 1); i >= 0; i--) {
    const lit = i === 0 && hover && hover.kind === 'deck' && hover.side === side;
    ctx.fillStyle   = lit ? '#454d5e' : '#39404e';
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth   = 1.5;
    roundRect(x - i * 2, y - i * 2, CARD_W, CARD_H, 9);
    ctx.fill();
    ctx.stroke();
  }

  ctx.fillStyle    = '#c3cad6';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.font         = 'bold 22px system-ui, sans-serif';
  ctx.fillText(n, x + CARD_W / 2, y + CARD_H / 2);
}

function drawEmptyPile(x, y, target) {
  ctx.save();
  ctx.setLineDash([5, 5]);
  ctx.lineWidth   = 1.5;
  ctx.strokeStyle = target ? 'rgba(224,182,74,0.34)' : 'rgba(255,255,255,0.10)';
  roundRect(x, y, CARD_W, CARD_H, 9);
  ctx.stroke();
  ctx.restore();
}

// Face-up, under a wash so the pile reads as spent rather than in play.
function drawGrave(side) {
  const { x, y } = gravePos(side);
  const pile = sides[side].grave;
  const n    = pile.length;
  const target = sel && sel.side === side && sel.from !== 'grave';
  const lit    = hover && hover.kind === 'grave' && hover.side === side;

  if (!n) { drawEmptyPile(x, y, target); return; }

  for (let i = Math.min(2, n - 1); i >= 1; i--) {
    ctx.fillStyle   = '#4c525f';
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth   = 1;
    roundRect(x - i * 2, y - i * 2, CARD_W, CARD_H, 9);
    ctx.fill();
    ctx.stroke();
  }

  const held = sel && sel.side === side && sel.from === 'grave' && sel.index === n - 1;
  drawCard(pile[n - 1], x, y, held);

  ctx.save();
  roundRect(x, y, CARD_W, CARD_H, 9);
  ctx.clip();
  ctx.fillStyle = `rgba(20,24,30,${held ? 0.14 : lit ? 0.24 : 0.42})`;
  ctx.fillRect(x, y, CARD_W, CARD_H);
  ctx.restore();

  if (target) {
    ctx.strokeStyle = 'rgba(224,182,74,0.85)';
    ctx.lineWidth   = 3;
    roundRect(x, y, CARD_W, CARD_H, 9);
    ctx.stroke();
  }

  const bw = 26, bh = 18, bx = x + CARD_W - bw - 7, by = y + 7;
  ctx.fillStyle = 'rgba(16,18,24,0.86)';
  roundRect(bx, by, bw, bh, 5);
  ctx.fill();
  ctx.fillStyle    = '#c3cad6';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.font         = 'bold 12px system-ui, sans-serif';
  ctx.fillText(n, bx + bw / 2, by + bh / 2 + 1);
}

// --- phase animation --------------------------------------------------------
//
// Each phase draws only its own cue, so what is on screen at any moment is the
// work of exactly one phase. `sim` is null whenever nothing is running, which
// leaves every other caller of draw() untouched.

// how far through the current phase, 0..1, or 0 if that phase is not on screen
function phaseT(key) {
  return sim && PHASES[sim.phase].key === key ? sim.t : 0;
}
function inPhase(key) { return !!sim && PHASES[sim.phase].key === key; }

const READY_COLOUR = '#6aa8e0';   // matches the charge pips
const AIM_COLOUR   = '#e8735f';   // matches the damage numbers

// CHARGE — a ring around everything whose cooldown just hit zero. Each ring
// arrives with the sweep, so they appear one at a time rather than twelve on
// one frame, and stay up once lit.
function drawReady() {
  if (!inPhase('charge')) return;
  ctx.save();
  ctx.strokeStyle = READY_COLOUR;
  ctx.shadowColor = READY_COLOUR;
  ctx.lineWidth   = 3;

  for (const { side, slot, order } of sim.data.ready) {
    const p = chargeProgress(order);
    if (p <= 0) continue;
    const lit = Math.min(1, p);
    ctx.globalAlpha = lit;
    ctx.shadowBlur  = 12;
    // the ring snaps in tight around the card as it lights
    const grow = 4 + 6 * (1 - lit);
    const { x, y } = slotPos(side, slot);
    roundRect(x - grow, y - grow, CARD_W + grow * 2, CARD_H + grow * 2, 9 + grow);
    ctx.stroke();
  }
  ctx.restore();
}

function cardCentre(side, slot) {
  const { x, y } = slotPos(side, slot);
  return { x: x + CARD_W / 2, y: y + CARD_H / 2 };
}

// where a ray leaving a card's centre crosses that card's edge, plus padding
function edgePoint(c, dx, dy, pad) {
  const s = Math.min(dx ? (CARD_W / 2 + pad) / Math.abs(dx) : Infinity,
                     dy ? (CARD_H / 2 + pad) / Math.abs(dy) : Infinity);
  return { x: c.x + dx * s, y: c.y + dy * s };
}

// DECLARE — one arrow per locked blow. Several blows on one victim fan apart so
// each stays its own line, and the arrows linger into STRIKE, fading out as the
// lunges begin, so the two phases read as one movement.
function drawAims() {
  const declaring = inPhase('declare');
  if (!declaring && !inPhase('strike')) return;

  const alpha = declaring ? Math.min(1, sim.t * 4)
                          : Math.max(0, 1 - sim.t / 0.3);
  if (alpha <= 0) return;
  const grow = declaring ? Math.min(1, sim.t / 0.6) : 1;

  // count first, so a fan can be centred on the line it spreads around
  const total = {}, seen = {};
  for (const b of sim.data.blows) {
    const key = `${b.toSide}:${b.toSlot}`;
    total[key] = (total[key] || 0) + 1;
  }

  ctx.save();
  ctx.globalAlpha = alpha;

  // a reticle on everything about to be hit
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = AIM_COLOUR;
  ctx.lineWidth = 2;
  for (const key of Object.keys(total)) {
    const [side, slot] = key.split(':');
    const { x, y } = slotPos(side, +slot);
    roundRect(x - 5, y - 5, CARD_W + 10, CARD_H + 10, 12);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  for (const b of sim.data.blows) {
    const key = `${b.toSide}:${b.toSlot}`;
    const i   = seen[key] = (seen[key] || 0) + 1;
    const off = (i - 1 - (total[key] - 1) / 2) * 15;

    const from = cardCentre(b.side, b.slot);
    const to   = cardCentre(b.toSide, b.toSlot);
    const len  = Math.hypot(to.x - from.x, to.y - from.y) || 1;
    const dx = (to.x - from.x) / len, dy = (to.y - from.y) / len;

    // slide both ends along the perpendicular, keeping the arrows parallel
    const shift = { x: -dy * off, y: dx * off };
    const a = edgePoint({ x: from.x + shift.x, y: from.y + shift.y }, dx, dy, 4);
    const z = edgePoint({ x: to.x + shift.x,   y: to.y + shift.y }, -dx, -dy, 7);

    const tip = { x: a.x + (z.x - a.x) * grow, y: a.y + (z.y - a.y) * grow };

    ctx.strokeStyle = AIM_COLOUR;
    ctx.fillStyle   = AIM_COLOUR;
    ctx.lineWidth   = 2.5;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(a.x, a.y, 3, 0, Math.PI * 2);
    ctx.fill();

    const head = 9;
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(tip.x - dx * head - dy * head * 0.55,
               tip.y - dy * head + dx * head * 0.55);
    ctx.lineTo(tip.x - dx * head + dy * head * 0.55,
               tip.y - dy * head - dx * head * 0.55);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

const LUNGE = 24;

// out and back over the first half of the strike
function lungeCurve(t) { return Math.sin(Math.PI * Math.min(t * 2, 1)); }

function lungeOffset(side, slot) {
  if (!inPhase('strike')) return { x: 0, y: 0 };
  const blow = sim.data.blows.find(b => b.side === side && b.slot === slot);
  if (!blow) return { x: 0, y: 0 };

  const from = slotPos(side, slot);
  const to   = slotPos(blow.toSide, blow.toSlot);
  const dx = to.x - from.x, dy = to.y - from.y;
  const len = Math.hypot(dx, dy) || 1;
  const amp = LUNGE * lungeCurve(sim.t);
  return { x: (dx / len) * amp, y: (dy / len) * amp };
}

// CLEANUP — units removed this tick keep their place while they fade
function drawDying() {
  if (!inPhase('cleanup')) return;
  const fade = 1 - Math.max(0, (sim.t - 0.15) / 0.85);

  for (const d of sim.data.dead) {
    const { x, y } = slotPos(d.side, d.slot);
    ctx.save();
    ctx.globalAlpha = Math.max(0, fade);
    drawCard(d.card, x, y, false);
    ctx.restore();
  }
}

// STRIKE — damage floats up off whoever took it
function drawDamage() {
  if (!inPhase('strike')) return;
  const rise = 26 * sim.t;
  const fade = sim.t < 0.45 ? 1 : 1 - (sim.t - 0.45) / 0.55;
  if (fade <= 0) return;

  const stacked = {};
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px system-ui, sans-serif';

  for (const b of sim.data.blows) {
    const key = `${b.toSide}:${b.toSlot}`;
    const n = stacked[key] = (stacked[key] || 0) + 1;
    const { x, y } = slotPos(b.toSide, b.toSlot);
    const px = x + CARD_W / 2 + (n - 1) * 22;
    const py = y + 30 - rise;

    ctx.lineWidth   = 3;
    ctx.strokeStyle = 'rgba(16,18,24,0.8)';
    ctx.strokeText(`-${b.dmg}`, px, py);
    ctx.fillStyle   = '#e8615a';
    ctx.fillText(`-${b.dmg}`, px, py);
  }
  ctx.restore();
}

// --- phase tracker ----------------------------------------------------------
//
// The four phases listed down the left margin, the current one lit, each
// showing what it turned up. The margin is empty between the two graveyards,
// so the panel never covers a card.

const PANEL = { x: 12, y: 282, w: 206, rowH: 34 };

function drawPhasePanel() {
  if (!sim) return;
  const { x, y, w, rowH } = PANEL;
  const h = 30 + PHASES.length * rowH + 42;

  ctx.save();
  ctx.fillStyle = 'rgba(16,19,25,0.78)';
  roundRect(x, y, w, h, 10);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.textBaseline = 'middle';
  ctx.textAlign    = 'left';
  ctx.font         = 'bold 11px system-ui, sans-serif';
  ctx.fillStyle    = '#7d8798';
  ctx.fillText(`TICK ${sim.tickNo} / ${TICKS}`, x + 14, y + 19);

  if (sim.paused) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#e0b64a';
    ctx.fillText('PAUSED', x + w - 14, y + 19);
    ctx.textAlign = 'left';
  }

  PHASES.forEach((ph, i) => {
    const ry      = y + 30 + i * rowH;
    const cy      = ry + rowH / 2;
    const current = i === sim.phase;
    const past    = i < sim.phase;

    if (current) {
      ctx.fillStyle = 'rgba(224,182,74,0.13)';
      roundRect(x + 6, ry + 2, w - 12, rowH - 4, 6);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(x + 22, cy, 4.5, 0, Math.PI * 2);
    if (current)   { ctx.fillStyle = '#e0b64a'; ctx.fill(); }
    else if (past) { ctx.fillStyle = 'rgba(255,255,255,0.34)'; ctx.fill(); }
    else {
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth   = 1.5;
      ctx.stroke();
    }

    ctx.font      = `${current ? 'bold ' : ''}13px system-ui, sans-serif`;
    ctx.fillStyle = current ? '#f0e4c4' : past ? '#8f97a3' : '#5d6472';
    ctx.fillText(ph.label, x + 38, cy);

    let n = sim.counts[ph.key];
    // the ready count follows the sweep instead of jumping to the total, so the
    // panel and the board agree on how far through the phase you are
    if (n !== undefined && current && ph.key === 'charge')
      n = sim.data.ready.filter(r => chargeProgress(r.order) > 0).length;

    if (n !== undefined) {
      ctx.textAlign = 'right';
      ctx.font      = '11px system-ui, sans-serif';
      ctx.fillStyle = current ? '#e0b64a' : '#6f7787';
      ctx.fillText(ph.tally(n), x + w - 14, cy);
      ctx.textAlign = 'left';
    }
  });

  const by = y + 30 + PHASES.length * rowH + 4;
  ctx.font      = '11px system-ui, sans-serif';
  ctx.fillStyle = '#7d8798';
  PHASES[sim.phase].blurb.forEach((line, i) =>
    ctx.fillText(line, x + 14, by + 11 + i * 14));

  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#2a2f3a';
  ctx.fillRect(0, 0, cv.width, cv.height);

  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.moveTo(40, cv.height / 2);
  ctx.lineTo(cv.width - 40, cv.height / 2);
  ctx.stroke();

  for (const side of SIDES) {
    for (let i = 0; i < SLOTS; i++) {
      const card = sides[side].field[i];
      if (!card) { drawSlot(side, i); continue; }
      const { x, y } = slotPos(side, i);
      const lunge = lungeOffset(side, i);
      drawCard(card, x + lunge.x, y + lunge.y,
        sel && sel.side === side && sel.from === 'field' && sel.index === i);
    }

    drawDeck(side);
    drawGrave(side);

    const hand = sides[side].hand;
    for (let i = 0; i < hand.length; i++) {
      const { x, y } = handPos(side, i);
      drawCard(hand[i], x, y,
        sel && sel.side === side && sel.from === 'hand' && sel.index === i);
    }
  }

  // phase cues sit on top of the board, one phase's worth at a time
  drawReady();
  drawAims();
  drawDying();
  drawDamage();
  drawPhasePanel();
}

// --- input ------------------------------------------------------------------

function mouse(e) {
  const r = cv.getBoundingClientRect();
  return [
    (e.clientX - r.left) * (cv.width  / r.width),
    (e.clientY - r.top)  * (cv.height / r.height),
  ];
}

function sameSpot(s, h) {
  return s && h && s.side === h.side && s.from === h.kind && s.index === h.index;
}

cv.addEventListener('mousemove', e => {
  if (simulating) return;
  const h = hitTest(...mouse(e));
  const changed = (h && h.kind)  !== (hover && hover.kind)  ||
                  (h && h.side)  !== (hover && hover.side)  ||
                  (h && h.index) !== (hover && hover.index);
  if (changed) { hover = h; draw(); }
});

cv.addEventListener('mouseleave', () => { hover = null; draw(); });

// right-click a unit on the field to crown it
cv.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (simulating) return;
  const hit = hitTest(...mouse(e));
  if (hit && hit.kind === 'field') toggleCrown(hit.side, hit.index);
  draw();
});

cv.addEventListener('click', e => {
  if (simulating) return;
  const hit = hitTest(...mouse(e));

  if (!hit) { sel = null; draw(); return; }

  if (hit.kind === 'deck') { drawFromDeck(hit.side); draw(); return; }

  if (!sel) {
    if (hit.kind === 'hand')
      sel = { side: hit.side, from: 'hand', index: hit.index };
    else if (hit.kind === 'field' && sides[hit.side].field[hit.index])
      sel = { side: hit.side, from: 'field', index: hit.index };
    else if (hit.kind === 'grave' && sides[hit.side].grave.length)
      sel = { side: hit.side, from: 'grave', index: sides[hit.side].grave.length - 1 };
    draw();
    return;
  }

  // Something is held. Moves stay on one side; touching the other side just
  // re-selects rather than reaching across the table.
  if (hit.kind === 'field') {
    if (hit.side === sel.side) { placeOnField(hit.index); sel = null; }
    else if (sides[hit.side].field[hit.index])
      sel = { side: hit.side, from: 'field', index: hit.index };
    else sel = null;
  } else if (hit.kind === 'hand') {
    if (sameSpot(sel, hit)) sel = null;
    else if (hit.side === sel.side && sel.from !== 'hand') {
      returnToHand(hit.index); sel = null;
    } else sel = { side: hit.side, from: 'hand', index: hit.index };
  } else if (hit.kind === 'grave') {
    if (hit.side === sel.side && sel.from !== 'grave') sendToGrave();
    sel = null;
  } else if (hit.kind === 'handzone') {
    if (hit.side === sel.side && sel.from !== 'hand') returnToHand();
    sel = null;
  }

  draw();
});

// --- simulation runner ------------------------------------------------------

const simBtn   = document.getElementById('sim');
const playBtn  = document.getElementById('play');
const stepBtn  = document.getElementById('step');
const statusEl = document.getElementById('status');

function setStatus(t) { statusEl.textContent = t; }

// The whole run lives here: which tick, which of its four phases, and how far
// through that phase we are. Null whenever nothing is running.
//   sim.t      0..1 through the current phase
//   sim.data   what this tick's phases have turned up so far
//   sim.counts what each phase of this tick returned, for the panel
let sim = null;
let lastFrame = 0;

function syncButtons() {
  simBtn.disabled  = simulating;
  playBtn.disabled = !simulating;
  playBtn.textContent = sim && !sim.paused ? '⏸ Pause' : '▶ Play';
}

function syncStatus() {
  if (!sim) return;
  setStatus(`tick ${sim.tickNo} / ${TICKS} · ${PHASES[sim.phase].label}` +
            (sim.paused ? ' · paused' : ''));
}

// Runs the phase, then hands its animation the screen. A phase that turned
// nothing up is not worth a beat, so it hands straight on — except CHARGE,
// which always has pips to move.
function enterPhase(index) {
  sim.phase  = index;
  const ph   = PHASES[index];
  const n    = PHASE_RUN[ph.key](sim.data);
  sim.counts[ph.key] = n;
  sim.t = 0;

  if (!n && ph.key !== 'charge') { nextPhase(); return; }
  syncStatus();
}

function nextPhase() {
  if (sim.phase + 1 < PHASES.length) { enterPhase(sim.phase + 1); return; }

  // the tick is over, and the board is settled — the only place a run can end
  const done = outcome();
  if (done || sim.tickNo >= TICKS) { finishSim(done); return; }
  beginTick();
}

function beginTick() {
  sim.tickNo++;
  sim.data   = newTickData();
  sim.counts = {};
  enterPhase(0);
}

function startSim(paused) {
  if (simulating) return;
  if (!fieldCount('top') || !fieldCount('bottom')) {
    setStatus('needs units on both sides');
    return;
  }

  simulating = true;
  sel = null;
  hover = null;

  // every unit starts its first swing from a full cooldown
  for (const side of SIDES)
    for (const card of sides[side].field) if (card) card.cd = attackInterval(card);

  sim = { tickNo: 0, phase: 0, t: 0, paused, data: newTickData(), counts: {} };
  lastFrame = performance.now();
  beginTick();

  if (simulating) {   // a one-sided board can finish inside the first tick
    syncButtons();
    requestAnimationFrame(frame);
  }
}

// Stopping is safe at any phase boundary: each phase leaves a settled board, so
// there is never half-applied damage to unwind.
function finishSim(done) {
  const at = sim ? sim.tickNo : 0;
  simulating = false;
  sim = null;
  syncButtons();
  setStatus(done ? `${done} — tick ${at}` : `${TICKS} ticks complete`);
  draw();
}

function stopSim() {
  const at = sim.tickNo, phase = PHASES[sim.phase].label.toLowerCase();
  finishSim(null);
  setStatus(`stopped after tick ${at} ${phase}`);
}

function frame(now) {
  if (!simulating) return;
  const dt = Math.min(64, now - lastFrame);   // a backgrounded tab must not skip
  lastFrame = now;

  const ph = PHASES[sim.phase];
  const ms = typeof ph.ms === 'function' ? ph.ms(sim.data) : ph.ms;
  // paused, the phase still animates — it just settles at its most readable
  // moment instead of running on into the next one
  sim.t = Math.min(sim.paused ? ph.hold : 1, sim.t + dt / ms);
  if (!sim.paused && sim.t >= 1) {
    nextPhase();
    if (!simulating) return;
  }

  draw();
  requestAnimationFrame(frame);
}

function togglePlay() {
  if (!simulating) return;
  sim.paused = !sim.paused;
  syncButtons();
  syncStatus();
}

function stepPhase() {
  if (!simulating) { startSim(true); return; }
  sim.paused = true;
  nextPhase();
  if (simulating) { syncButtons(); syncStatus(); draw(); }
}

simBtn.textContent  = `Simulate ${TICKS} tick${TICKS === 1 ? '' : 's'}`;
stepBtn.textContent = '⏭ Step';
simBtn.addEventListener('click', () => startSim(false));
playBtn.addEventListener('click', togglePlay);
stepBtn.addEventListener('click', stepPhase);

addEventListener('keydown', e => {
  if (e.target.tagName === 'BUTTON') e.target.blur();   // space must not re-click
  if (e.key === ' ')          { e.preventDefault(); simulating ? togglePlay() : startSim(false); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepPhase(); }
  else if (e.key === 'Escape' && simulating) stopSim();
});

syncButtons();
for (const side of SIDES) for (let i = 0; i < 5; i++) drawFromDeck(side);
draw();
</script>
</body>
</html>
