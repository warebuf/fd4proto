<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0; height: 100vh;
    display: grid; place-content: center; gap: 14px;
    background: #12141a; color: #8f97a3;
    font: 14px system-ui, sans-serif;
  }
  canvas {
    border-radius: 10px; cursor: pointer;
    box-shadow: 0 18px 50px rgba(0,0,0,0.55);
  }
  #bar { display: flex; gap: 12px; align-items: center; }
  button {
    font: inherit; padding: 6px 14px;
    border: 1px solid #39424a; border-radius: 6px;
    background: #21272d; color: #dfe4e8; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #2b333a; }
  button:disabled { opacity: 0.45; cursor: default; }
  #status { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<canvas id="c" width="1024" height="768"></canvas>
<div id="bar">
  <button id="sim"></button>
  <span id="status"></span>
</div>

<script>
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

const CARD_W = 100, CARD_H = 100, GAP = 15;
const COLS = 5, ROWS = 2, SLOTS = COLS * ROWS;
const HAND_MAX_W = 900;   // hands fan inward past this, rather than overflowing
const SIDES = ['top', 'bottom'];

// field[0..2] is always the frontline and field[3..5] the backline, on BOTH
// sides. Only slotPos() knows that a top-side frontline draws lower on screen
// than its backline — every rule downstream can just ask `index < COLS`.
function isFront(index) { return index < COLS; }

// Rows mirror about the centre line, so the two frontlines face each other.
const ROW_Y = {
  top:    { hand:  26, front: 262, back: 150 },
  bottom: { hand: 642, front: 406, back: 518 },
};

const FIELD_X = (cv.width - (COLS * CARD_W + (COLS - 1) * GAP)) / 2;
const DECK_X  = FIELD_X + COLS * (CARD_W + GAP) + 40;
const GRAVE_X = cv.width - DECK_X - CARD_W;   // mirrors the deck across the board

// --- state ------------------------------------------------------------------

let nextId = 1;

const STAT_MIN = 1, STAT_MAX = 5;
const roll = () => STAT_MIN + Math.floor(Math.random() * (STAT_MAX - STAT_MIN + 1));

function makeCard() {
  const card = { id: nextId++, crowned: false, atk: roll(), spd: roll(), hp: roll(), cd: 0 };
  card.cd = attackInterval(card);   // starts uncharged
  return card;
}

function makeSide() {
  const deck = [];
  for (let i = 0; i < 20; i++) deck.push(makeCard());
  return { deck, hand: [], grave: [], field: new Array(SLOTS).fill(null) };
}

const sides = { top: makeSide(), bottom: makeSide() };

// what the player has picked up: { side, from: 'hand'|'field'|'grave', index }
let sel   = null;
let hover = null;

// the board is read-only while a simulation is running
let simulating = false;

// --- layout -----------------------------------------------------------------

function handStep(n) {
  if (n <= 1) return 0;
  return Math.min(CARD_W + GAP, (HAND_MAX_W - CARD_W) / (n - 1));
}

// cards lift toward the middle of the table, so both hands read the same way
function liftDir(side) { return side === 'top' ? 1 : -1; }

function handPos(side, i) {
  const n    = sides[side].hand.length;
  const step = handStep(n);
  const x    = (cv.width - (CARD_W + step * (n - 1))) / 2 + i * step;
  let   y    = ROW_Y[side].hand;

  if (sel && sel.side === side && sel.from === 'hand' && sel.index === i)
    y += liftDir(side) * 24;
  else if (hover && hover.kind === 'hand' && hover.side === side && hover.index === i)
    y += liftDir(side) * 12;

  return { x, y };
}

function slotPos(side, index) {
  return {
    x: FIELD_X + (index % COLS) * (CARD_W + GAP),
    y: ROW_Y[side][isFront(index) ? 'front' : 'back'],
  };
}

// deck and graveyard sit outboard on each side's back row, deck right, grave left
function deckPos(side)  { return { x: DECK_X,  y: ROW_Y[side].back }; }
function gravePos(side) { return { x: GRAVE_X, y: ROW_Y[side].back }; }

function handBand(side) {
  return { y: ROW_Y[side].hand + Math.min(0, liftDir(side) * 24), h: CARD_H + 24 };
}

// --- hit testing ------------------------------------------------------------

function inRect(mx, my, x, y, w = CARD_W, h = CARD_H) {
  return mx >= x && mx < x + w && my >= y && my < y + h;
}

function hitTest(mx, my) {
  for (const side of SIDES) {
    // backwards, so the topmost card wins any overlap in a fanned hand
    const hand = sides[side].hand;
    for (let i = hand.length - 1; i >= 0; i--) {
      const { x, y } = handPos(side, i);
      if (inRect(mx, my, x, y)) return { kind: 'hand', side, index: i };
    }

    for (let i = 0; i < SLOTS; i++) {
      const { x, y } = slotPos(side, i);
      if (inRect(mx, my, x, y)) return { kind: 'field', side, index: i };
    }

    const d = deckPos(side);
    if (sides[side].deck.length && inRect(mx, my, d.x, d.y))
      return { kind: 'deck', side };

    const gy = gravePos(side);
    if (inRect(mx, my, gy.x, gy.y)) return { kind: 'grave', side };

    // empty space in the hand row — lets a field card be pulled back to hand
    const band = handBand(side);
    if (inRect(mx, my, 0, band.y, cv.width, band.h))
      return { kind: 'handzone', side };
  }
  return null;
}

// --- actions ----------------------------------------------------------------

function drawFromDeck(side) {
  const s = sides[side];
  if (s.deck.length) s.hand.push(s.deck.pop());
}

// The crown is a field status and a side may hold only one, so crowning a
// second unit moves it rather than being refused. Leaving the field drops it.
function crownedIndex(side) {
  return sides[side].field.findIndex(c => c && c.crowned);
}

function toggleCrown(side, index) {
  const card = sides[side].field[index];
  if (!card) return;
  const wasCrowned = card.crowned;
  for (const c of sides[side].field) if (c) c.crowned = false;
  card.crowned = !wasCrowned;
}

// hand and graveyard are both plain lists, so they behave alike as a source
function zoneList(side, from) {
  return from === 'hand' ? sides[side].hand : sides[side].grave;
}

// An occupied destination swaps rather than overwrites, so a card is never
// destroyed by a misclick.
function placeOnField(dest) {
  const s = sides[sel.side];

  if (sel.from === 'field') {
    const card = s.field[sel.index];
    s.field[sel.index] = s.field[dest];
    s.field[dest] = card;
    return;
  }

  const list     = zoneList(sel.side, sel.from);
  const card     = list[sel.index];
  const occupant = s.field[dest];
  s.field[dest] = card;
  if (occupant) { occupant.crowned = false; list[sel.index] = occupant; }
  else          list.splice(sel.index, 1);
}

// Lift the held card out of wherever it is. The crown is a field status, so it
// never survives the trip.
function liftSelected() {
  const s = sides[sel.side];
  let card;

  if (sel.from === 'field') {
    card = s.field[sel.index];
    if (!card) return null;
    s.field[sel.index] = null;
  } else {
    card = zoneList(sel.side, sel.from).splice(sel.index, 1)[0];
    if (!card) return null;
  }

  card.crowned = false;
  card.cd = attackInterval(card);
  return card;
}

function returnToHand(at) {
  const card = liftSelected();
  if (!card) return;
  const hand = sides[sel.side].hand;
  hand.splice(at === undefined ? hand.length : at, 0, card);
}

function sendToGrave() {
  const card = liftSelected();
  if (card) sides[sel.side].grave.push(card);
}

// --- combat -----------------------------------------------------------------

const TICKS = 3;
const TICK_MS = 1000;   // one animated tick

let simTicks  = 0;
let tickStart = 0;

function other(side) { return side === 'top' ? 'bottom' : 'top'; }

// abilities are NOT simultaneous. they resolve one at a time by card position,
// down each column before moving right: left front, left back, second front,
// second back. attacks and deaths are simultaneous, abilities cannot be
//
// "left" means each player's own left, so the board is symmetric under a 180
// degree turn. The top player's sweep therefore runs right to left across the
// screen, and the two sides sweep toward each other.
const RESOLUTION_ORDER = { top: [], bottom: [] };
for (let col = 0; col < COLS; col++) {
  const mirrored = COLS - 1 - col;
  RESOLUTION_ORDER.bottom.push(col, col + COLS);
  RESOLUTION_ORDER.top.push(mirrored, mirrored + COLS);
}

// SPD is how fast, not how slow: 5 SPD swings every tick, 1 SPD every 5.
function attackInterval(card) { return STAT_MAX + 1 - card.spd; }

// TARGETING — the one rule to change if you want different behaviour. Uniformly
// random across every living enemy; position buys nothing.
function targetFor(side) {
  const foe = sides[other(side)].field;
  const live = [];
  for (let i = 0; i < SLOTS; i++) if (foe[i]) live.push(i);
  if (!live.length) return -1;
  return live[Math.floor(Math.random() * live.length)];
}

// The corpse keeps the damage that killed it, so the board stays readable after
// a run. The crown does not follow it — that is field state, and letting it into
// the graveyard would let a revived unit make two crowns on one side.
function kill(side, index) {
  const s = sides[side];
  const card = s.field[index];
  card.crowned = false;
  s.grave.push(card);
  s.field[index] = null;
}

// A tick runs in phases:
//
//   1. cooldowns — who is ready to swing
//   2. declare   — each swinger locks a target against the board as it stands
//   3. damage    — every blow lands at once, so neither side resolves "first"
//   4. cleanup   — anything at or below 0 hp dies
//
// Damage is simultaneous because no sequential order can be fair: whoever swings
// first removes their own retaliator. In mirror matches, resolving all of one
// side first won 84% of games, and interleaving by slot still won 68%.
//
// TRIGGERS, when they arrive, do NOT go in phase 3. They belong in a queue
// drained after it — and again after phase 4 for death triggers — resolving one
// event at a time in the order queued. That is what keeps them legible: an
// effect always reads a settled board, never one that is half updated. Phase 1's
// row-major walk (frontline left to right, then backline) is what decides that
// queue order, so it stays a tiebreak rather than an advantage.
function tick() {
  const swinging = [];
  for (let k = 0; k < SLOTS; k++)
    for (const side of SIDES) {
      const i = RESOLUTION_ORDER[side][k];
      const card = sides[side].field[i];
      if (!card) continue;
      if (--card.cd <= 0) { card.cd = attackInterval(card); swinging.push([side, i]); }
    }

  const blows = [];
  for (const [side, i] of swinging) {
    const attacker = sides[side].field[i];
    const t = targetFor(side);
    if (t < 0) continue;
    blows.push({ side, slot: i, toSide: other(side), toSlot: t, dmg: attacker.atk });
  }

  // nothing is removed until phase 4, so two blows on one unit both land
  for (const b of blows) {
    const victim = sides[b.toSide].field[b.toSlot];
    if (victim) victim.hp -= b.dmg;
  }

  const dead = [];
  for (let k = 0; k < SLOTS; k++)
    for (const side of SIDES) {
      const i = RESOLUTION_ORDER[side][k];
      const card = sides[side].field[i];
      if (card && card.hp <= 0) { dead.push({ side, slot: i, card }); kill(side, i); }
    }

  return { blows, dead };
}

function fieldCount(side) { return sides[side].field.filter(Boolean).length; }

function outcome() {
  const t = fieldCount('top'), b = fieldCount('bottom');
  if (!t && !b) return 'both sides wiped';
  if (!t) return 'bottom wins';
  if (!b) return 'top wins';
  return null;
}

// --- drawing ----------------------------------------------------------------

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

// ATK / SPD / HP across the foot of the card, colour-coded so the three read
// apart at a glance without needing the labels
const STAT_STRIP = 40;
const STATS = [
  ['ATK', 'atk', '#b4463c'],
  ['SPD', 'spd', '#4a7fb5'],
  ['HP',  'hp',  '#3f8a5c'],
];

function drawStats(card, x, y) {
  const top = y + CARD_H - STAT_STRIP;

  ctx.strokeStyle = 'rgba(30,35,42,0.16)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.moveTo(x + 9,          top);
  ctx.lineTo(x + CARD_W - 9, top);
  ctx.stroke();

  ctx.textAlign = 'center';
  STATS.forEach(([label, key, colour], i) => {
    const cx = x + CARD_W * (i * 2 + 1) / (STATS.length * 2);

    ctx.textBaseline = 'top';
    ctx.fillStyle    = '#8b8880';
    ctx.font         = '9px system-ui, sans-serif';
    ctx.fillText(label, cx, top + 6);

    ctx.textBaseline = 'middle';
    ctx.fillStyle    = colour;
    ctx.font         = 'bold 21px system-ui, sans-serif';
    ctx.fillText(card[key], cx, top + 27);
  });
}

// three-peaked crown on a banded base, drawn in a 26x17 box
function drawCrown(x, y) {
  const w = 26, h = 17, band = 5;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x,           y + h - band);
  ctx.lineTo(x,           y + 2);
  ctx.lineTo(x + w * 0.27, y + h - band - 3);
  ctx.lineTo(x + w / 2,   y);
  ctx.lineTo(x + w * 0.73, y + h - band - 3);
  ctx.lineTo(x + w,       y + 2);
  ctx.lineTo(x + w,       y + h - band);
  ctx.closePath();
  ctx.fillStyle = '#e8c15c';
  ctx.fill();
  ctx.strokeStyle = '#8a6a1c';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.rect(x - 1, y + h - band, w + 2, band);
  ctx.fillStyle = '#d9ae43';
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// One pip per tick of the unit's attack interval, filling as it charges. A SPD 5
// unit shows a single pip that fills every tick; a SPD 1 unit shows five.
function drawCharge(card, x, y) {
  const total  = attackInterval(card);
  const filled = Math.max(0, Math.min(total, total - card.cd));
  const r = 4.5, gap = 5;
  const w = total * (r * 2) + (total - 1) * gap;
  let px = x + (CARD_W - w) / 2 + r;
  const py = y + 45;

  for (let i = 0; i < total; i++) {
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    if (i < filled) {
      ctx.fillStyle = '#4a7fb5';
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(30,35,42,0.30)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    px += r * 2 + gap;
  }
}

function drawCard(card, x, y, selected) {
  ctx.save();
  ctx.shadowColor   = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur    = 14;
  ctx.shadowOffsetY = 5;
  ctx.fillStyle     = '#f7f6f2';
  roundRect(x, y, CARD_W, CARD_H, 9);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = selected ? '#e0b64a' : '#cdc9c0';
  ctx.lineWidth   = selected ? 3 : 1.5;
  roundRect(x, y, CARD_W, CARD_H, 9);
  ctx.stroke();

  ctx.fillStyle    = '#1e232a';
  ctx.textAlign    = 'left';
  ctx.textBaseline = 'top';
  ctx.font         = 'bold 16px system-ui, sans-serif';
  ctx.fillText(card.id, x + 10, y + 9);

  drawCharge(card, x, y);
  drawStats(card, x, y);

  if (card.crowned) drawCrown(x + CARD_W - 35, y + 9);
}

function drawSlot(side, index) {
  const { x, y } = slotPos(side, index);
  const isTarget = sel && sel.side === side;
  const isHover  = hover && hover.kind === 'field' &&
                   hover.side === side && hover.index === index;

  let stroke;
  if (isTarget) {
    stroke = `rgba(224,182,74,${isHover ? 0.9 : 0.34})`;
  } else {
    stroke = `rgba(255,255,255,${isHover ? 0.26 : 0.12})`;
  }

  ctx.save();
  ctx.setLineDash([5, 5]);
  ctx.lineWidth   = 1.5;
  ctx.strokeStyle = stroke;
  roundRect(x, y, CARD_W, CARD_H, 9);
  ctx.stroke();
  ctx.restore();
}

function drawDeck(side) {
  const { x, y } = deckPos(side);
  const n = sides[side].deck.length;

  if (!n) {
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth   = 1.5;
    roundRect(x, y, CARD_W, CARD_H, 9);
    ctx.stroke();
    ctx.restore();
    return;
  }

  // a few offset backs, so the stack reads as depth
  for (let i = Math.min(3, n - 1); i >= 0; i--) {
    const lit = i === 0 && hover && hover.kind === 'deck' && hover.side === side;
    ctx.fillStyle   = lit ? '#454d5e' : '#39404e';
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth   = 1.5;
    roundRect(x - i * 2, y - i * 2, CARD_W, CARD_H, 9);
    ctx.fill();
    ctx.stroke();
  }

  ctx.fillStyle    = '#c3cad6';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.font         = 'bold 22px system-ui, sans-serif';
  ctx.fillText(n, x + CARD_W / 2, y + CARD_H / 2);
}

function drawEmptyPile(x, y, target) {
  ctx.save();
  ctx.setLineDash([5, 5]);
  ctx.lineWidth   = 1.5;
  ctx.strokeStyle = target ? 'rgba(224,182,74,0.34)' : 'rgba(255,255,255,0.10)';
  roundRect(x, y, CARD_W, CARD_H, 9);
  ctx.stroke();
  ctx.restore();
}

// Face-up, under a wash so the pile reads as spent rather than in play.
function drawGrave(side) {
  const { x, y } = gravePos(side);
  const pile = sides[side].grave;
  const n    = pile.length;
  const target = sel && sel.side === side && sel.from !== 'grave';
  const lit    = hover && hover.kind === 'grave' && hover.side === side;

  if (!n) { drawEmptyPile(x, y, target); return; }

  for (let i = Math.min(2, n - 1); i >= 1; i--) {
    ctx.fillStyle   = '#4c525f';
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth   = 1;
    roundRect(x - i * 2, y - i * 2, CARD_W, CARD_H, 9);
    ctx.fill();
    ctx.stroke();
  }

  const held = sel && sel.side === side && sel.from === 'grave' && sel.index === n - 1;
  drawCard(pile[n - 1], x, y, held);

  ctx.save();
  roundRect(x, y, CARD_W, CARD_H, 9);
  ctx.clip();
  ctx.fillStyle = `rgba(20,24,30,${held ? 0.14 : lit ? 0.24 : 0.42})`;
  ctx.fillRect(x, y, CARD_W, CARD_H);
  ctx.restore();

  if (target) {
    ctx.strokeStyle = 'rgba(224,182,74,0.85)';
    ctx.lineWidth   = 3;
    roundRect(x, y, CARD_W, CARD_H, 9);
    ctx.stroke();
  }

  const bw = 26, bh = 18, bx = x + CARD_W - bw - 7, by = y + 7;
  ctx.fillStyle = 'rgba(16,18,24,0.86)';
  roundRect(bx, by, bw, bh, 5);
  ctx.fill();
  ctx.fillStyle    = '#c3cad6';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.font         = 'bold 12px system-ui, sans-serif';
  ctx.fillText(n, bx + bw / 2, by + bh / 2 + 1);
}

// --- tick animation ---------------------------------------------------------
//
// anim holds the events of the tick currently on screen, animT its progress
// through that tick. Both are null/1 when nothing is running, so every other
// caller of draw() is unaffected.

let anim  = null;
let animT = 1;

const LUNGE = 24;

// out and back over the first half of the tick
function lungeCurve(t) { return Math.sin(Math.PI * Math.min(t * 2, 1)); }

function lungeOffset(side, slot) {
  if (!anim) return { x: 0, y: 0 };
  const blow = anim.blows.find(b => b.side === side && b.slot === slot);
  if (!blow) return { x: 0, y: 0 };

  const from = slotPos(side, slot);
  const to   = slotPos(blow.toSide, blow.toSlot);
  const dx = to.x - from.x, dy = to.y - from.y;
  const len = Math.hypot(dx, dy) || 1;
  const amp = LUNGE * lungeCurve(animT);
  return { x: (dx / len) * amp, y: (dy / len) * amp };
}

// units removed this tick keep their place while they fade
function drawDying() {
  if (!anim) return;
  const fade = animT < 0.45 ? 1 : 1 - (animT - 0.45) / 0.55;

  for (const d of anim.dead) {
    const { x, y } = slotPos(d.side, d.slot);
    ctx.save();
    ctx.globalAlpha = Math.max(0, fade);
    drawCard(d.card, x, y, false);
    ctx.restore();
  }
}

// damage floats up off whoever took it
function drawDamage() {
  if (!anim) return;
  const rise = 26 * animT;
  const fade = animT < 0.35 ? 1 : 1 - (animT - 0.35) / 0.65;
  if (fade <= 0) return;

  const stacked = {};
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px system-ui, sans-serif';

  for (const b of anim.blows) {
    const key = `${b.toSide}:${b.toSlot}`;
    const n = stacked[key] = (stacked[key] || 0) + 1;
    const { x, y } = slotPos(b.toSide, b.toSlot);
    const px = x + CARD_W / 2 + (n - 1) * 22;
    const py = y + 30 - rise;

    ctx.lineWidth   = 3;
    ctx.strokeStyle = 'rgba(16,18,24,0.8)';
    ctx.strokeText(`-${b.dmg}`, px, py);
    ctx.fillStyle   = '#e8615a';
    ctx.fillText(`-${b.dmg}`, px, py);
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = '#2a2f3a';
  ctx.fillRect(0, 0, cv.width, cv.height);

  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.moveTo(40, cv.height / 2);
  ctx.lineTo(cv.width - 40, cv.height / 2);
  ctx.stroke();

  for (const side of SIDES) {
    for (let i = 0; i < SLOTS; i++) {
      const card = sides[side].field[i];
      if (!card) { drawSlot(side, i); continue; }
      const { x, y } = slotPos(side, i);
      const lunge = lungeOffset(side, i);
      drawCard(card, x + lunge.x, y + lunge.y,
        sel && sel.side === side && sel.from === 'field' && sel.index === i);
    }

    drawDeck(side);
    drawGrave(side);

    const hand = sides[side].hand;
    for (let i = 0; i < hand.length; i++) {
      const { x, y } = handPos(side, i);
      drawCard(hand[i], x, y,
        sel && sel.side === side && sel.from === 'hand' && sel.index === i);
    }
  }

  drawDying();
  drawDamage();
}

// --- input ------------------------------------------------------------------

function mouse(e) {
  const r = cv.getBoundingClientRect();
  return [
    (e.clientX - r.left) * (cv.width  / r.width),
    (e.clientY - r.top)  * (cv.height / r.height),
  ];
}

function sameSpot(s, h) {
  return s && h && s.side === h.side && s.from === h.kind && s.index === h.index;
}

cv.addEventListener('mousemove', e => {
  if (simulating) return;
  const h = hitTest(...mouse(e));
  const changed = (h && h.kind)  !== (hover && hover.kind)  ||
                  (h && h.side)  !== (hover && hover.side)  ||
                  (h && h.index) !== (hover && hover.index);
  if (changed) { hover = h; draw(); }
});

cv.addEventListener('mouseleave', () => { hover = null; draw(); });

// right-click a unit on the field to crown it
cv.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (simulating) return;
  const hit = hitTest(...mouse(e));
  if (hit && hit.kind === 'field') toggleCrown(hit.side, hit.index);
  draw();
});

cv.addEventListener('click', e => {
  if (simulating) return;
  const hit = hitTest(...mouse(e));

  if (!hit) { sel = null; draw(); return; }

  if (hit.kind === 'deck') { drawFromDeck(hit.side); draw(); return; }

  if (!sel) {
    if (hit.kind === 'hand')
      sel = { side: hit.side, from: 'hand', index: hit.index };
    else if (hit.kind === 'field' && sides[hit.side].field[hit.index])
      sel = { side: hit.side, from: 'field', index: hit.index };
    else if (hit.kind === 'grave' && sides[hit.side].grave.length)
      sel = { side: hit.side, from: 'grave', index: sides[hit.side].grave.length - 1 };
    draw();
    return;
  }

  // Something is held. Moves stay on one side; touching the other side just
  // re-selects rather than reaching across the table.
  if (hit.kind === 'field') {
    if (hit.side === sel.side) { placeOnField(hit.index); sel = null; }
    else if (sides[hit.side].field[hit.index])
      sel = { side: hit.side, from: 'field', index: hit.index };
    else sel = null;
  } else if (hit.kind === 'hand') {
    if (sameSpot(sel, hit)) sel = null;
    else if (hit.side === sel.side && sel.from !== 'hand') {
      returnToHand(hit.index); sel = null;
    } else sel = { side: hit.side, from: 'hand', index: hit.index };
  } else if (hit.kind === 'grave') {
    if (hit.side === sel.side && sel.from !== 'grave') sendToGrave();
    sel = null;
  } else if (hit.kind === 'handzone') {
    if (hit.side === sel.side && sel.from !== 'hand') returnToHand();
    sel = null;
  }

  draw();
});

// --- simulation runner ------------------------------------------------------

const simBtn = document.getElementById('sim');
const statusEl = document.getElementById('status');

function setStatus(t) { statusEl.textContent = t; }

function startSim() {
  if (simulating) return;
  if (!fieldCount('top') || !fieldCount('bottom')) {
    setStatus('needs units on both sides');
    return;
  }

  simulating = true;
  sel = null;
  hover = null;
  simBtn.disabled = true;

  // every unit starts its first swing from a full cooldown
  for (const side of SIDES)
    for (const card of sides[side].field) if (card) card.cd = attackInterval(card);

  simTicks  = 0;
  anim      = null;
  animT     = 1;
  tickStart = performance.now() - TICK_MS;   // so the first frame runs a tick
  requestAnimationFrame(frame);
}

function finishSim(done) {
  simulating = false;
  anim  = null;
  animT = 1;
  simBtn.disabled = false;
  setStatus(done ? `${done} — tick ${simTicks}` : `${TICKS} ticks complete`);
  draw();
}

function frame(now) {
  if (!simulating) return;

  if (now - tickStart >= TICK_MS) {
    const done = outcome();
    if (simTicks >= TICKS || done) { finishSim(done); return; }

    anim = tick();
    simTicks++;
    tickStart = now;
    setStatus(`tick ${simTicks} / ${TICKS}`);
  }

  animT = Math.min(1, (now - tickStart) / TICK_MS);
  draw();
  requestAnimationFrame(frame);
}

simBtn.textContent = `Simulate ${TICKS} tick${TICKS === 1 ? '' : 's'}`;
simBtn.addEventListener('click', startSim);

for (const side of SIDES) for (let i = 0; i < 5; i++) drawFromDeck(side);
draw();
</script>
</body>
